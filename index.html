<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening WhatsApp...</title>

  <script>
    const phone = "919800863595";
    const message = "Bhai Python basics";

    const app = `whatsapp://send?phone=${phone}&text=${encodeURIComponent(message)}`;
    const web = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

    // Try to open WhatsApp app
    window.location.href = app;

    // Instant fallback (almost no delay)
    setTimeout(() => {
      window.location.href = web;
    }, 1);
  </script>
</head>

<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial;">
  <p>Opening WhatsApp...</p>
</body>
</html>
